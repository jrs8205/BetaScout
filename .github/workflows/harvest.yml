# Scheduled harvest: refresh the beta catalog from APKMirror + Google Play
# (via gplayapi) and commit catalog/catalog.json.
#
# Requires two repository secrets for a THROWAWAY Google account (never a
# personal one — this uses Google Play's unofficial API):
#   GPLAY_EMAIL       the account email
#   GPLAY_AAS_TOKEN   its AAS master token (from harvester/tools/get-aas-token.mjs)
#
# Until Cloudflare serving is set up, the catalog is published by committing it
# here (fetchable via GitHub raw); that publish step will later target KV instead.

name: Harvest beta catalog

on:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch gplayapi jar
        run: |
          curl -sL https://repo1.maven.org/maven2/com/auroraoss/gplayapi/3.4.2/gplayapi-3.4.2.aar -o /tmp/g.aar
          # The jar executes with the Play credentials in scope; a tampered
          # artifact must fail the run, not run. Maven Central artifacts are
          # immutable, so the pin only changes with the version.
          echo "5653052845cee813cd909995bc5e9d9d8846604b53df88cf0ea0965dc99e79e2  /tmp/g.aar" | sha256sum -c -
          mkdir -p harvester/gplay/libs
          unzip -o /tmp/g.aar classes.jar -d harvester/gplay/libs
          mv harvester/gplay/libs/classes.jar harvester/gplay/libs/gplayapi-3.4.2.jar

      - name: Write credentials
        run: printf 'EMAIL=%s\nAAS_TOKEN=%s\n' "${{ secrets.GPLAY_EMAIL }}" "${{ secrets.GPLAY_AAS_TOKEN }}" > harvester/.gplay.local

      - name: Harvest
        env:
          GPLAY_ENABLED: '1'
          MAX_APPS: '30'
          # Crowd hints: the step degrades to a no-op when the token is unset.
          HINTS_URL: https://betascout-catalog.jarsi.workers.dev/hints
          HINTS_TOKEN: ${{ secrets.HINTS_TOKEN }}
          # Temporarily raised from 100 to drain the hint backlog; restore to 100 afterwards.
          GPLAY_HINTS_CAP: '300'
        run: node harvester/src/run.js

      - name: Remove credentials
        if: always()
        run: rm -f harvester/.gplay.local

      # Git first: the repo is the catalog's source of truth and survives a KV
      # outage; KV can always be re-published from it.
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog/catalog.json
          git add harvester/hints-rejected.json 2>/dev/null || true
          git add harvester/hints-errored.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m 'Update beta catalog [skip ci]'
            # Main can move during the long harvest run; rebase and retry so a
            # non-fast-forward rejection doesn't discard the night's ~300
            # Google Play verifications.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "git push failed after 3 attempts" >&2
                exit 1
              fi
              git pull --rebase
            done
          fi

      # A missing token FAILS the run on purpose: silently skipping would let
      # the consume step below drop hints whose catalog never reached the KV
      # the app actually serves from.
      - name: Publish catalog to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; failing so hints are not consumed." >&2
            exit 1
          fi
          npx wrangler kv key put --remote \
            --namespace-id 5deb2577b8524356a98468b5fb60f5df \
            catalog --path catalog/catalog.json

      # Runs last on purpose: hints are consumed from the Worker only once the
      # catalog they settled into has been durably published to BOTH git and
      # KV. If any earlier step fails, they stay pending and the next run
      # settles them again.
      - name: Consume settled hints
        env:
          HINTS_URL: https://betascout-catalog.jarsi.workers.dev/hints
          HINTS_TOKEN: ${{ secrets.HINTS_TOKEN }}
        run: node harvester/src/consume.js
